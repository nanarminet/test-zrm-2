# ------------------------------------------------------------------ 3. Identification des ressources
[ressources_intro]
titre = "Identification des ressources"
corps = """
Durant cette étape, vous allez partir à la découverte de vos ressources.

Vous allez identifier les éléments qui vous aideront à avoir un comportement bénéfique pour vous.

