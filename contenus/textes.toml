Bonne découverte !
"""

[bilan_principe]
titre = "Le bilan émotionnel"
corps = """
Au cours de votre parcours, un bilan émotionnel vous sera parfois demandé.

Il consiste, sur une situation donnée, à évaluer la part d'émotions positives et d'émotions négatives, de manière séparée.

Le principe ? S'assurer que votre corps fait bien partie de l'aventure et que ce n'est pas la tête seule qui décide.
"""
curseur_positif = "Émotions positives"
curseur_negatif = "Émotions négatives"
theorie_titre = "Et la théorie ? En savoir plus sur la théorie"
theorie = """
Le bilan émotionnel sollicite votre capacité à observer les signaux envoyés par votre corps. Théorisés par le Dr Antonio Damasio, les marqueurs somatiques sont des manifestations (des sensations par exemple) qui produisent de façon totalement inconsciente lorsqu'on est confronté à quelque chose (une image ou une situation par exemple).

**Pourquoi analyser séparément vos émotions ?**

Parce que les affects positifs et négatifs sont produits dans le cerveau par deux systèmes totalement distincts et indépendants : le système de récompense (nucleus accumbens) qui génère les ressentis positifs et le système de punition (amygdale) qui génère les ressentis négatifs.

Comme ces deux circuits s'activent en parallèle, une même chose peut provoquer un mélange d'enthousiasme et de frein. Les évaluer séparément permet de rendre visibles ces forces contraires.
"""

[bilan_test]
titre = "Le bilan émotionnel : faisons le test"
corps = """
Au cours de votre parcours, un bilan émotionnel vous sera parfois demandé. Le principe ?

Les éléments que vous choisissez ne devront générer aucune émotion négative et au moins 70 % d'émotions positives.

**Faisons le test !** Réalisez le bilan émotionnel correspondant à l'organisation d'un dîner entre amis.

Déplacez les curseurs afin qu'ils correspondent à ce que vous ressentez puis cliquez sur « Valider ».
"""
bouton = "Valider"
resultat = """
Organiser un dîner peut activer les deux échelles de manière bien distinctes.

D'un côté, la joie d'accueillir, le plaisir de cuisiner et l'impatience de partager un bon moment.

De l'autre, la pression de bien faire, qui peut susciter du stress ou de l'angoisse.

Ces deux ressentis ne s'annulent pas : ils coexistent souvent en même temps.

Même si un bilan émotionnel est par essence personnel, voici quelques exemples.
"""
exemples_media = "Exemples de bilans émotionnels"
regle = """
Dans le cadre du ZRM®, le bilan émotionnel des éléments que vous choisirez devra toujours être le suivant :

- Aucune (0) émotions négatives
- 70 % au moins d'émotions positives
"""

