"""

[ressources_video]
titre = "Identification des ressources"
corps = """
« Mobiliser vos ressources pour changer vos habitudes »

Les images et le motto sont des ressources, dans lesquelles vous pouvez puiser pour vous aider à adopter un comportement plus bénéfique pour vous.

Mais ce ne sont pas les seules.

Découvrez dans cette vidéo ce que sont les ressources définies par le ZRM© : à quoi servent-elles et quelles sont-elles ?
"""
media = "Vidéo de 3 minutes : Mobiliser vos ressources pour changer vos habitudes"
resume_titre = "En résumé"
resume = """
Pour agir conformément à son objectif ou « motto », il est nécessaire d'activer régulièrement le réseau de neurones associé.

À force de répétition, ce chemin se renforce et le comportement souhaité devient une habitude.

Une ressource est ce qui vous permet cette activation cérébrale bénéfique. Pour être efficace, elle doit obligatoirement remplir deux critères : être fonctionnelle et procurer du plaisir.

Votre image et votre motto sont des ressources mais ce ne sont pas les seules. On trouve aussi :

- les aide-mémoire
- les ressources corporelles
- les ressources sociales
"""

[aide_theorie]
titre = "Définir mes aide-mémoire"
corps = """
Les aide-mémoire font partie des ressources du ZRM©.

**Un aide-mémoire = tout objet, odeur, musique, qui vous évoque votre motto.**

En effet, le réseau neuronal s'active non seulement par une action (quand vous agissez avec succès en adéquation avec votre motto) mais aussi grâce à une activité mentale.

En d'autres termes, penser à votre motto, de manière consciente ou inconsciente, est déjà bénéfique pour agir, plus tard, en adéquation avec votre objectif.
"""
usages = """
Les aide-mémoire peuvent être utilisés :

- **soit de façon consciente** : lorsqu'on active consciemment son motto, dans une situation donnée pour produire un nouveau comportement. On déclenche le motto volontairement.
- **soit de façon inconsciente** : lorsqu'on perçoit une amorce (aussi appelé « prime ») que l'on a créé en amont, afin de nous inciter dans un deuxième temps à se comporter de la façon souhaitée. On perçoit juste l'amorce, qui inconsciemment fait référence à notre motto.
"""

[aide_panier]
titre = "Définir mes aide-mémoire"
corps = """
Et vous, quels seront vos aide-mémoire ?

Nous allons définir vos aide-mémoire, qui sont efficaces et qui vous font plaisir.

Pour commencer, ayez en tête votre motto et votre image.
"""
revoir_titre = "Revoir mon image et relire mon motto"
suite = "Nous allons maintenant faire un panier aux idées pour vous aider à définir vos aide-mémoire."
temoignage = "Nous allons vous aider à définir vos aide-mémoire afin de vous faire penser consciemment ou inconsciemment à votre motto. Avant, vous pouvez écouter le témoignage de Sophie."

