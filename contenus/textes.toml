# ------------------------------------------------------------------ Transcriptions écrites du témoignage de Sophie
# Source : document « Témoignage Sophie » du Drive (reprise telle quelle). Alternative écrite aux enregistrements audio
# (accessibilité : personnes sourdes ou malentendantes).
[transcriptions]
image = """
« D'habitude, quand ça ne va pas, je me ferme totalement et je rentre dans ma coquille. Mais là, en voyant cette image de géraniums, ça a fait « clic » tout de suite. Sans réfléchir, sans analyser, j'ai vraiment laissé parler mes tripes. J'ai été attirée de façon instinctive par ce rouge éclatant et ce bois chaud. C'est tout ce que je voulais incarner comme attitude : une idée d'ouverture vers les autres, de la joie. Ça m'a apporté un truc réconfortant, une sensation super chaleureuse. Franchement, cette fenêtre ouverte avec ses fleurs, ça m'a fait un bien fou. »
"""
idees = """
« En parcourant les idées proposées par les autres, ces mots en vert ont immédiatement déclenché un déclic :

- Chaleur et Lumière : ça fait direct écho au rouge des géraniums et au bois ensoleillé, ça me réchauffe le cœur.
- Se sentir chez soi et Sérénité : c'est l'apaisement que m'inspire cette fenêtre ouverte, la sécurité dont j'ai besoin pour ne plus me renfermer.
- Authentique et Bois : ça me donne une sensation d'ancrage, de quelque chose de solide et de vrai.
- Fraîcheur intérieure et Fleuri : c'est toute la vitalité des fleurs, ce souffle nouveau qui me donne de l'énergie.
- Force et Amour : ce sont les ressources profondes que je veux faire vibrer pour aller vers les autres.

Chacun de ces mots me procure une sensation 100 % positive, m'apaise et me porte. C'est tout ce que je veux être. »
"""
souhait = """
« J'ai formulé ce souhait parce que, plus jeune, je ne me posais pas mille questions : j'étais spontanée, joyeuse et naturellement ouverte aux autres. Avec les aléas de la vie, j'ai pris l'habitude de me protéger en me fermant dès qu'une difficulté apparaît. Reconnecter avec cette petite fille, ce n'est pas régresser, c'est aller chercher l'énergie brute, la légèreté et la confiance que j'avais alors. En y associant la force et la maturité que j'ai développées aujourd'hui, je me donne toutes les chances de m'épanouir pleinement, sans plus jamais me cacher. »
"""
motto = """
« J'ai choisi ce motto parce qu'il fait directement écho aux mots qui m'ont marquée dans le panier à idées. "Avec tendresse", c'est ma façon de cesser d'être dure envers moi-même quand je me sens vulnérable. "Cultiver mes valeurs", c'est l'ancrage solide, cet aspect authentique et vrai que m'évoquait le bois de la fenêtre. Et enfin, "s'ouvrir à la douceur de la vie", c'est le pas décisif pour sortir de ma coquille : j'ouvre mes volets à la chaleur, à la lumière et à la joie, exactement comme ces géraniums qui s'épanouissent. »
"""
aide_memoire = """
« Pour faire vivre mon motto au quotidien, j'ai mis en place des aide-mémoire autour de moi :

D'une part, en aide-mémoire fixe, j'ai mis la photo de la fenêtre aux géraniums en fond d'écran d'ordinateur pour penser à m'ouvrir dès le matin. Sur le frigo, j'ai aussi collé un mot doux avec cette couleur rouge éclatante.

Et en aide-mémoire mobile, j'ai accroché un pompon rouge vif et doux à mes clés. Et mon mot de passe de session est fortement inspiré de mon motto… pour me le répéter à chaque fois que je le tape. »
"""
mouvements = """
« Pour ancrer physiquement mon motto, j'utilise mon corps :

J'ai un grand mouvement que j'aime bien : quand je sens que je me ferme, je me lève, j'ouvre grands les bras et j'écarte les jambes. Je prends de la place.

Et puis j'ai un mouvement plus discret. J'accroche mes pouces entre eux. C'était mon geste refuge quand j'étais petite. Ça me ramène directement à ma spontanéité d'enfant et ça m'apaise instantanément. »
"""
